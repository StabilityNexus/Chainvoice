[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["openzeppelin-contracts/=lib/openzeppelin-contracts/"]
solc_version = "0.8.19"
# Pinned so one bytecode runs on every EVM chain Chainvoice targets, including
# ones that have not adopted newer upgrades: later targets emit opcodes such
# chains lack (PUSH0 from shanghai, MCOPY/TSTORE from cancun).
evm_version = "london"
optimizer = true
optimizer_runs = 200
# Sepolia charges several times more gas for deployed code than forge's local
# simulation; only the smaller via_ir bytecode fits its per-transaction gas
# cap. Set here so tests run the same bytecode that gets deployed.
via_ir = true

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
etc = "${ETC_RPC_URL}"
mordor = "${MORDOR_RPC_URL}"
amoy = "${AMOY_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
amoy = { key = "${ETHERSCAN_API_KEY}", chain = 80002 }
