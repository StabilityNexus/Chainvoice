[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["openzeppelin-contracts/=lib/openzeppelin-contracts/"]
solc_version = "0.8.19"
# Pinned so one bytecode runs on both Sepolia and Ethereum Classic. Newer
# targets emit opcodes ETC does not have (PUSH0 from shanghai, MCOPY/TSTORE
# from cancun); london is the newest fork ETC fully matches.
evm_version = "london"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
etc = "${ETC_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
