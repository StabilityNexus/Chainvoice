<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chainvoice</title>
    <!--
      Static hosts serve this page for every path they have no file for, which
      includes every deep link into the app. The app uses HashRouter, so the
      route has to live in the fragment:
        /dashboard/received?page=2  ->  /#/dashboard/received?page=2
      Hash URLs never reach the server, so this page only ever sees path-style
      URLs. Any fragment already on the 404'd URL is dropped: it was never an
      app route, and a second '#' inside the hash route would be ambiguous.
    -->
    <script type="text/javascript">
        // A github.io project page serves the app from /<repo>/, so that
        // segment stays in the path. Everywhere else the app is at the root.
        var l = window.location;
        var segments = l.pathname.split('/');
        var pathSegmentsToKeep = l.hostname.endsWith('.github.io') && segments.length > 2 ? 1 : 0;
        var basePath = segments.slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
        var route = segments.slice(1 + pathSegmentsToKeep).join('/');
        l.replace(l.protocol + '//' + l.host + basePath + '#/' + route + l.search);
    </script>
</head>
<body>
    <noscript><a href="/">Go to Chainvoice</a></noscript>
</body>
</html>
