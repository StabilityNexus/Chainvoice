server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Chainvoice is a single-page app served from base '/', so any path that is
    # not a real file has to fall back to index.html. Without this, refreshing
    # on /dashboard or opening a shared invoice link returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable, so let the browser keep them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin path to the ThruBox relay.
    #
    # The relay serves no CORS headers, so the browser cannot call it
    # cross-origin. Proxying it here is the production counterpart of the
    # /relay proxy in vite.config.js, and it is what VITE_RELAY_URL=/relay
    # in the build stage expects (see resolveBaseUrl in
    # src/services/relay/relayClient.js).
    location /relay/ {
        # Resolve the upstream at request time via Docker's embedded DNS rather
        # than once at startup, so nginx survives the relay being restarted or
        # recreated with a new address. Using a variable in proxy_pass disables
        # nginx's automatic prefix stripping, hence the explicit rewrite.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $relay_upstream relay:3000;

        rewrite ^/relay/(.*)$ /$1 break;
        proxy_pass http://$relay_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The relay client always appends a path, but redirect the bare form so a
    # hand-typed /relay does not fall through to the SPA.
    location = /relay {
        return 301 /relay/;
    }
}
