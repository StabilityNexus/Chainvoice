name: Changed paths
description: >-
  Reports whether a pull request changes a file matching a pattern, so a
  workflow can skip its jobs instead of being path-filtered. A skipped job
  still passes a required status check; a workflow that never started leaves
  it pending forever. Any event other than a pull request counts as a match.

inputs:
  pattern:
    description: Extended regular expression matched against each changed file path.
    required: true

outputs:
  matched:
    description: "'true' if a changed file matches (or the list could not be read), otherwise 'false'."
    value: ${{ steps.check.outputs.matched }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PATTERN: ${{ inputs.pattern }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
      run: |
        # Fails open: if the file list cannot be fetched, or may be cut short
        # by the endpoint's 3,000-file cap, the checks run. A rename counts
        # under its old path too, so moving a file out of a directory still
        # runs that directory's checks.
        matched=true
        if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
          [ "${CHANGED_FILES:-0}" -lt 3000 ] &&
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')" &&
          ! grep -qE "$PATTERN" <<< "$files"; then
          matched=false
        fi
        echo "matched=$matched" >> "$GITHUB_OUTPUT"
        echo "Changes matching '$PATTERN': $matched"
