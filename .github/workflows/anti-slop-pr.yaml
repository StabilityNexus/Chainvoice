name: Anti Slop PR

permissions:
  contents: read
  issues: read
  pull-requests: write

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  anti-slop:
    runs-on: ubuntu-latest
    steps:
      - uses: peakoss/anti-slop@57858eead489d08b255fab2af45a506c2ca6eab2 # v0.3.0
        with:
          max-failures: 4
          failure-pr-message: >-
            This PR was closed automatically because it failed several of the
            repository's quality checks. See the "Anti Slop PR" check for which
            ones failed. If you think this is a mistake, fix what the check
            reports and ask a maintainer on Discord to reopen it.
