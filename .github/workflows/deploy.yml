# Workflow for deploying static content to GitHub Pages via gh-pages branch.
# Preserves any PR preview directories that already exist on gh-pages.
name: Deploy static content to Pages

on:
  push:
    branches: ['main']
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  # Required by peaceiris/actions-gh-pages to push built site to the gh-pages branch
  contents: write

concurrency:
  group: 'gh-pages-deploy'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies with proper command detection
      - name: Install dependencies
        run: |
          if [ -f "./frontend/package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
        working-directory: ./frontend

      # Build project
      - name: Build
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_CONTRACT_ADDRESS_11155111: ${{ secrets.VITE_CONTRACT_ADDRESS_11155111 }}
          # Ethereum Classic and Polygon are deliberately not injected. Both
          # still run the v1 contract, which stores payloads on-chain as strings
          # and has no key registry, so it does not match this ABI. The app
          # treats any non-empty address as a supported network, so a populated
          # secret here would publish a build that sends undecodable calls.
          # Restore these once those chains are redeployed.
          # Vite inlines these at build time, so an unset VITE_RELAY_URL bakes
          # in the localhost fallback, which the browser then blocks as mixed
          # content from the Pages origin. Either an https URL (needs CORS on
          # the relay) or a path the host rewrites to it.
          #
          # Repository *variables*, not secrets: everything here is published in
          # the JavaScript bundle, and storing a published value as a secret
          # invites someone to put a privileged relay key in it. A static site
          # cannot hold a credential — if the relay needs a private key, put a
          # proxy in front and inject it there.
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
          VITE_RELAY_API_KEY: ${{ vars.VITE_RELAY_API_KEY }}
          VITE_RELAY_TIMEOUT_MS: ${{ vars.VITE_RELAY_TIMEOUT_MS }}

      # Restore PR preview directories from gh-pages branch (if present)
      # so that a production redeploy does not wipe them out.
      - name: Restore PR preview directories from gh-pages
        run: |
          git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1 || {
            echo "gh-pages branch does not exist yet — skipping restore."
            exit 0
          }

          git fetch origin gh-pages --depth=1

          # Copy the pr-preview tree into the freshly built dist so the
          # subsequent deploy action includes it in the push.
          git checkout origin/gh-pages -- pr-preview/ 2>/dev/null && {
            cp -r pr-preview ./frontend/dist/pr-preview
            rm -rf pr-preview
          } || {
            echo "No pr-preview directory on gh-pages yet — skipping restore."
          }

      # Add .nojekyll to prevent Jekyll processing
      - name: Add .nojekyll
        run: touch ./frontend/dist/.nojekyll

      # Deploy to gh-pages branch
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          cname: chainvoice.stability.nexus
          commit_message: "deploy: production site from ${{ github.sha }}"
