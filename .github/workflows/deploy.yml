# Production deploy: builds the frontend and publishes it to the gh-pages
# branch, which is what GitHub Pages serves. PR previews are not published
# here; they go to Cloudflare Pages, on an origin of their own (pr-deploy.yml).
name: Deploy static content to Pages

on:
  push:
    branches: ['main']
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: 'gh-pages-production'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pushes the built site to gh-pages
      pages: read # reads the site's own URL and custom domain
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing in this job uses git: the publish script clones with
          # GH_TOKEN of its own. Persisting the token into .git/config
          # would only leave a write-capable credential lying in the
          # workspace while the build runs.
          persist-credentials: false

      # Where the site is served from decides what --base the bundle needs. It
      # is / here because of the custom domain, but /<repo>/ on a fork, and a
      # bundle built for the wrong one 404s on every asset.
      - name: Resolve Pages location
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_SITE_URL: ${{ vars.PAGES_SITE_URL }}
        run: bash .github/scripts/pages-config.sh

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: './frontend/.nvmrc'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build
        run: npm run build -- --base "$BASE_PATH"
        working-directory: ./frontend
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_CONTRACT_ADDRESS_11155111: ${{ secrets.VITE_CONTRACT_ADDRESS_11155111 }}
          # Ethereum Classic and Polygon are deliberately not injected. Both
          # still run the v1 contract, which stores payloads on-chain as strings
          # and has no key registry, so it does not match this ABI. The app
          # treats any non-empty address as a supported network, so a populated
          # secret here would publish a build that sends undecodable calls.
          # Restore these once those chains are redeployed.
          # Vite inlines these at build time, so an unset VITE_RELAY_URL bakes
          # in the localhost fallback, which the browser then blocks as mixed
          # content from the Pages origin. Either an https URL (needs CORS on
          # the relay) or a path the host rewrites to it.
          #
          # Repository *variables*, not secrets: everything here is published in
          # the JavaScript bundle, and storing a published value as a secret
          # invites someone to put a privileged relay key in it. A static site
          # cannot hold a credential — if the relay needs a private key, put a
          # proxy in front and inject it there.
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
          VITE_RELAY_API_KEY: ${{ vars.VITE_RELAY_API_KEY }}
          VITE_RELAY_TIMEOUT_MS: ${{ vars.VITE_RELAY_TIMEOUT_MS }}

      # Pages keeps the custom domain only while a CNAME file sits at the root
      # of what it serves, and it is this deploy that owns the root. Written
      # from the domain Pages already has rather than a literal, so a fork —
      # which has no custom domain, and could not claim this one — publishes
      # without it.
      - name: Write CNAME
        if: steps.pages.outputs.cname != ''
        env:
          CNAME: ${{ steps.pages.outputs.cname }}
        run: printf '%s\n' "$CNAME" > ./frontend/dist/CNAME

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: 'deploy: production site from ${{ github.sha }}'
        run: bash .github/scripts/gh-pages-publish.sh ./frontend/dist
