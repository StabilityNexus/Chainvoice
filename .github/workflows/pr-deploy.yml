# Publishes PR previews to Cloudflare Pages, at pr-<n>.<project>.pages.dev.
#
# Previews live on their own origin, never on the production site's: a
# preview runs code nobody has merged, and on the production origin that code
# could read invoices people stored there and ask for the signature their
# messaging keys are derived from.
#
# Runs in the base repository's context, so it holds the Cloudflare credentials
# and a token that can comment on the pull request. It therefore never checks
# out or executes the pull request's code: pr-build.yml already built it, in the
# pull request's own context, and this workflow only unpacks that artifact.
#
# Three things arrive here untrusted, and all are treated that way:
#   - The artifact, which is whatever a fork's build wrote. Checked before it is
#     uploaded, and stripped of anything Cloudflare would run or serve as
#     configuration.
#   - The triggering run's identity. Which pull request this is comes from the
#     workflow_run payload, resolved against the API — never from a file the
#     other workflow produced, because a fork controls its own copy of it.
#   - Whether a preview is allowed at all. A fork can rewrite every condition in
#     pr-build.yml, so the decision is made here, from the API.

name: 'PR Preview: Deploy'

on:
  workflow_run:
    workflows: ['PR Preview: Build']
    types: [completed]

permissions: {}

# One preview in flight per head branch. Two pushes in quick succession would
# otherwise race to publish, and the newer commit is always the one worth
# showing.
concurrency:
  group: pr-preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'chainvoice-preview' }}

jobs:
  resolve:
    name: Resolve target
    # A failed build has nothing worth publishing, and it already shows up as a
    # failed check on the pull request. A closed pull request's run succeeds
    # with its build job skipped, so cleanup still gets here.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read # the maintainer's approval
      actions: read # whether the triggering run produced a build
    outputs:
      mode: ${{ steps.pr.outputs.mode }}
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # This repository's own default branch, spelled out. Nothing in these
          # jobs may come from the pull request, and which commit checkout would
          # pick by itself on a `workflow_run` is not worth relying on when that
          # is what it decides.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve pull request
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { LABEL, hasWriteAccess, findApproval } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-access.js`,
            );
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // Worked out from the event payload alone. A `pull_request` run
            // executes the fork's own copy of pr-build.yml, so a number coming
            // from that run could name any pull request in this repository —
            // and this workflow can delete previews and post bot comments.
            const findPullRequest = async () => {
              // Populated only when head and base are the same repository.
              if (run.pull_requests?.length) {
                const { data } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: run.pull_requests[0].number,
                });
                return data;
              }
              const prs = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'all',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
                per_page: 100,
              });
              // Prefer the pull request this exact commit belongs to. A newer
              // push leaves this run's sha behind, and then the open pull
              // request on the branch is the one meant; failing that, a branch
              // reused across several closed pull requests resolves to
              // whichever was touched most recently.
              return (
                prs.find((pr) => pr.head.sha === run.head_sha) ??
                prs.find((pr) => pr.state === 'open') ??
                prs.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0]
              );
            };

            const settle = (mode, why, pr) => {
              core.info(why);
              core.setOutput('mode', mode);
              if (pr) core.setOutput('number', String(pr.number));
              core.setOutput('sha', run.head_sha);
            };

            const pr = await findPullRequest();
            if (!pr) {
              return settle('none', `No pull request for ${run.head_repository.full_name}:${run.head_branch}.`);
            }
            // A closed pull request loses its preview, merged or not.
            if (pr.state === 'closed') {
              return settle('cleanup', `PR #${pr.number} is closed.`, pr);
            }
            // A newer push is already being built, and that run will publish.
            if (pr.head.sha !== run.head_sha) {
              return settle('none', `PR #${pr.number} has moved on to ${pr.head.sha.slice(0, 7)}.`);
            }
            // The run was for a label other than preview, so nothing was built.
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              name: 'pr-preview-dist',
            });
            if (!artifacts.total_count) {
              return settle('none', `Run ${run.id} produced no build.`);
            }

            const author = pr.user.login;
            if (await hasWriteAccess({ github, context }, author)) {
              return settle('deploy', `PR #${pr.number}: @${author} has write access.`, pr);
            }
            const approval = await findApproval({ github, context }, run.head_sha);
            const labelled = pr.labels.some((label) => label.name === LABEL);
            if (approval && labelled) {
              return settle('deploy', `PR #${pr.number}: ${approval.description}.`, pr);
            }
            settle('awaiting', `PR #${pr.number}: ${run.head_sha.slice(0, 7)} is not approved.`, pr);

  publish:
    name: Publish preview
    needs: resolve
    if: needs.resolve.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # reads the build's artifact from the triggering run
      pull-requests: write # comments the preview URL
      issues: write # listComments/createComment go through the issues API
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.number }}
      HEAD_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download preview build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-preview-dist
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the build before publishing it
        working-directory: preview
        run: |
          set -euo pipefail

          # The artifact holds whatever a fork's build wrote. A static site has
          # no use for symlinks or a .git entry.
          if [ -n "$(find . -type l -print -quit)" ]; then
            echo "::error::preview build contains symlinks"
            exit 1
          fi
          if [ -e .git ]; then
            echo "::error::preview build contains a .git entry"
            exit 1
          fi
          if [ ! -f index.html ]; then
            echo "::error::preview build has no index.html"
            exit 1
          fi
          # Cloudflare runs a _worker.js, file or directory, as server-side
          # code on every request to the preview.
          if [ -e _worker.js ]; then
            echo "::error::preview build contains _worker.js"
            exit 1
          fi

          # Response headers, redirects and routing are this workflow's to set,
          # not the build's.
          rm -f _headers _redirects _routes.json
          cat > _headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow
            X-Frame-Options: DENY
            Content-Security-Policy: frame-ancestors 'none'
          EOF

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: './frontend/.nvmrc'

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          # Uploading static files needs none of the native binaries wrangler's
          # dependencies fetch at install time, and their install hooks would
          # otherwise run in a step holding the Cloudflare token.
          npm_config_ignore_scripts: 'true'
        run: |
          set -euo pipefail
          # From an empty directory: wrangler compiles a functions/ directory
          # and reads a wrangler config from wherever it runs, and a preview
          # should pick up neither.
          cd "$(mktemp -d)"
          npx --yes wrangler@4.148.0 pages deploy "${GITHUB_WORKSPACE}/preview" \
            --project-name "$PROJECT" \
            --branch "pr-${PR_NUMBER}" \
            --commit-hash "$HEAD_SHA" \
            --commit-message "PR #${PR_NUMBER}" \
            --commit-dirty=true

      - name: Remove superseded deployments and comment the URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          script: |
            const scripts = `${process.env.GITHUB_WORKSPACE}/.github/scripts`;
            const { client, prune } = require(`${scripts}/cloudflare-pages.js`);
            const upsert = require(`${scripts}/upsert-comment.js`);

            const cf = client({
              accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
              apiToken: process.env.CLOUDFLARE_API_TOKEN,
              project: process.env.PROJECT,
            });
            const prNumber = Number(process.env.PR_NUMBER);
            const branch = `pr-${prNumber}`;

            // The upload that just finished is the newest, and the concurrency
            // group keeps any other run for this branch from adding one.
            const { removed } = await prune(cf, branch, { keep: 1 });
            core.info(`Removed ${removed} superseded deployment(s) of ${branch}.`);

            const { subdomain } = await cf.project();
            const url = `https://${branch}.${subdomain}/`;
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const body =
              '### 🔍 PR Preview\n\n' +
              '| | |\n|---|---|\n' +
              `| **Preview** | ${url} |\n` +
              `| **Commit** | \`${sha}\` |\n` +
              '| **Networks** | Ethereum Sepolia only, on a preview contract |\n\n' +
              '> Rebuilt on every commit, and removed when this pull request closes. ' +
              'For contributors without write access, each new commit waits for a maintainer ' +
              'to add the `preview` label again.';
            await upsert({ github, context, core }, prNumber, body);

  awaiting:
    name: Wait for approval
    needs: resolve
    if: needs.resolve.outputs.mode == 'awaiting'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Say what the preview is waiting for
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
        with:
          script: |
            const scripts = `${process.env.GITHUB_WORKSPACE}/.github/scripts`;
            const { client, branchOf, commitOf, newestFirst } = require(`${scripts}/cloudflare-pages.js`);
            const upsert = require(`${scripts}/upsert-comment.js`);

            const prNumber = Number(process.env.PR_NUMBER);
            const branch = `pr-${prNumber}`;

            // An earlier commit may have been approved, and its preview stays up
            // until this one is. Only a nicety: runs Dependabot triggers get no
            // Actions secrets, and the comment matters more than the link.
            let previous = '';
            if (process.env.CLOUDFLARE_API_TOKEN) {
              try {
                const cf = client({
                  accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
                  apiToken: process.env.CLOUDFLARE_API_TOKEN,
                  project: process.env.PROJECT,
                });
                const [latest] = (await cf.previewDeployments())
                  .filter((deployment) => branchOf(deployment) === branch)
                  .sort(newestFirst);
                if (latest) {
                  const { subdomain } = await cf.project();
                  previous =
                    `| **Last approved preview** | https://${branch}.${subdomain}/ ` +
                    `(\`${commitOf(latest).slice(0, 7)}\`) |\n`;
                }
              } catch (error) {
                core.warning(`Could not look up the last approved preview: ${error.message}`);
              }
            }

            const body =
              '### 🔍 PR Preview\n\n' +
              '⏸️ **Waiting for a maintainer.** Pull requests from contributors without write ' +
              'access get a preview once a maintainer has reviewed the code and added the ' +
              '`preview` label, and every new commit needs that approval again.\n\n' +
              '| | |\n|---|---|\n' +
              `| **Commit** | \`${process.env.HEAD_SHA.slice(0, 7)}\` |\n` +
              previous;
            await upsert({ github, context, core }, prNumber, body);

  cleanup:
    name: Remove preview
    needs: resolve
    if: needs.resolve.outputs.mode == 'cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Delete every deployment of the preview
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
        with:
          script: |
            const scripts = `${process.env.GITHUB_WORKSPACE}/.github/scripts`;
            const { client, prune } = require(`${scripts}/cloudflare-pages.js`);
            const upsert = require(`${scripts}/upsert-comment.js`);

            const prNumber = Number(process.env.PR_NUMBER);
            // Runs Dependabot triggers get no Actions secrets. Its pull requests
            // only ever have a preview if a maintainer approved one, and the
            // weekly sweep deletes that.
            if (!process.env.CLOUDFLARE_API_TOKEN) {
              core.warning(`No Cloudflare credentials in this run; leaving pr-${prNumber} to the sweep.`);
              return;
            }
            const cf = client({
              accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
              apiToken: process.env.CLOUDFLARE_API_TOKEN,
              project: process.env.PROJECT,
            });
            const { removed } = await prune(cf, `pr-${prNumber}`);
            core.info(`Removed ${removed} deployment(s) of pr-${prNumber}.`);

            const body =
              '### 🔍 PR Preview\n\n' +
              '| | |\n|---|---|\n' +
              '| **Status** | 🗑️ Removed — this pull request is closed |\n';
            // onlyIfPresent: a pull request that never had a preview should not
            // acquire a comment announcing that its preview is gone.
            await upsert({ github, context, core }, prNumber, body, { onlyIfPresent: true });
