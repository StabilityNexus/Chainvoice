name: Test and Build

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/test.yml'
      - '.github/actions/**'
  # Not path-filtered, so test-and-build can be a required check: the
  # `changes` job skips it instead, and a skipped job counts as passing.
  pull_request:

# Read-only on purpose. This workflow runs untrusted fork code, so it must not
# hold a token that can write to the repo. Labels and the build-size comment are
# posted by pr-report.yml, which runs after this one in the base-repo context.
permissions:
  contents: read

# A new push to a pull request makes the run for the previous commit worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.matched }}
    steps:
      - name: Checkout the changed-paths action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Check for frontend changes
        id: filter
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^(frontend/|\.github/workflows/test\.yml$|\.github/actions/)'

  test-and-build:
    needs: changes
    # !cancelled() lets it run if `changes` itself failed, rather than skip and
    # pass the required check without testing anything.
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: './frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        continue-on-error: true
        run: |
          npm run lint > lint_output.log 2>&1 || echo "LINT_FAILED=true" >> $GITHUB_ENV
          cat lint_output.log

      - name: Run tests with coverage
        id: test
        continue-on-error: true
        run: |
          npm run test:ci > test_output.log 2>&1 || echo "TESTS_FAILED=true" >> $GITHUB_ENV
          cat test_output.log

      - name: Run build
        id: build
        continue-on-error: true
        run: |
          npm run build > build_output.log 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
          cat build_output.log

      # Results only. This job runs the fork's own copy of this file, so nothing
      # written here is trustworthy; pr-report.yml resolves the target PR from the
      # workflow_run payload rather than from anything in this artifact.
      - name: Collect report data
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p pr-report
          echo "${LINT_FAILED:-false}" > pr-report/lint_failed
          echo "${TESTS_FAILED:-false}" > pr-report/tests_failed
          echo "${BUILD_FAILED:-false}" > pr-report/build_failed
          cp lint_output.log pr-report/ 2>/dev/null || true
          cp test_output.log pr-report/ 2>/dev/null || true
          cp build_output.log pr-report/ 2>/dev/null || true

      - name: Upload report data
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-report
          path: frontend/pr-report
          retention-days: 1

      - name: Fail if lint failed
        if: env.LINT_FAILED == 'true'
        run: exit 1

      - name: Fail if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1

      - name: Fail if build failed
        if: env.BUILD_FAILED == 'true'
        run: exit 1
