name: Test and Build

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        continue-on-error: true
        run: npm run lint

      - name: Run tests with coverage
        id: test
        continue-on-error: true
        run: |
          npm run test:ci > test_output.log 2>&1 || echo "TESTS_FAILED=true" >> $GITHUB_ENV
          cat test_output.log

      - name: Fail if tests failed
        id: test-result
        if: env.TESTS_FAILED == 'true'
        run: |
          echo "tests_failed=true" >> $GITHUB_OUTPUT
          exit 1

      - name: Run build
        id: build
        continue-on-error: true
        run: |
          npm run build > build_output.log 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
          cat build_output.log

      - name: Fail if build failed
        id: build-result
        if: env.BUILD_FAILED == 'true'
        run: |
          echo "build_failed=true" >> $GITHUB_OUTPUT
          exit 1

      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            ./frontend/test_output.log
            ./frontend/build_output.log
          if-no-files-found: ignore
          retention-days: 1

    outputs:
      tests_failed: ${{ steps.test-result.outputs.tests_failed }}
      build_failed: ${{ steps.build-result.outputs.build_failed }}

  report-results:
    needs: test-and-build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Download CI logs
        uses: actions/download-artifact@v4
        with:
          name: ci-logs
          path: ./logs
        continue-on-error: true

      - name: Handle Test Failure
        if: needs.test-and-build.outputs.tests_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let testOutput = '';
            try {
              testOutput = fs.readFileSync('./logs/test_output.log', 'utf8');
              if (testOutput.length > 60000) {
                testOutput = testOutput.substring(testOutput.length - 60000);
              }
            } catch (e) {
              testOutput = 'Could not read test output.';
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['test case failing']
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **Tests failed!**\n\n<details><summary>Test Output</summary>\n\n\`\`\`\n${testOutput}\n\`\`\`\n</details>`
              });
            } catch (e) {
              console.log('Failed to add labels or comment:', e.message);
            }

      - name: Remove test failure label (if passed)
        if: needs.test-and-build.outputs.tests_failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'test case failing'
              });
            } catch (e) {
              // Ignore if label doesn't exist
            }

      - name: Handle Build Failure
        if: needs.test-and-build.outputs.build_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['build failed']
              });
            } catch (e) {
              console.log('Failed to add label:', e.message);
            }

      - name: Report Build Size
        if: needs.test-and-build.outputs.build_failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let buildOutput = '';
            try {
              buildOutput = fs.readFileSync('./logs/build_output.log', 'utf8');
              const lines = buildOutput.split('\n');
              const metrics = lines.filter(line => line.includes('dist/assets/')).join('\n');
              buildOutput = metrics || 'Metrics not found';
            } catch (e) {
              buildOutput = 'Could not read build output.';
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `✅ **Build successful!**\n\n<details><summary>Build Size Metrics</summary>\n\n\`\`\`\n${buildOutput}\n\`\`\`\n</details>`
              });
            } catch (e) {
              console.log('Failed to add comment:', e.message);
            }
